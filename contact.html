<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Space - Contact</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <header>
        <h1>Study Space</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h2>Contact Us</h2>

        <p>
            Have a question or want to tell us about your study goals?
            Fill out the form below.
        </p>

        <form action="#" method="post">

            <!-- Text -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <!-- Number -->
            <label for="age">Age:</label>
            <input type="number" id="age" name="age">

            <br><br>

            <!-- Date -->
            <label for="date">Preferred Study Date:</label>
            <input type="date" id="date" name="date">

            <br><br>

            <!-- Radio Buttons -->
            <p>What is your favorite study method?</p>

            <input type="radio" id="reading" name="method" value="reading">
            <label for="reading">Reading</label>

            <input type="radio" id="videos" name="method" value="videos">
            <label for="videos">Videos</label>

            <input type="radio" id="practice" name="method" value="practice">
            <label for="practice">Practice</label>

            <br><br>

            <!-- Checkboxes -->
            <p>What subjects do you study?</p>

            <input type="checkbox" id="math" name="subject" value="math">
            <label for="math">Mathematics</label>

            <input type="checkbox" id="programming" name="subject" value="programming">
            <label for="programming">Programming</label>

            <input type="checkbox" id="database" name="subject" value="database">
            <label for="database">Database</label>

            <br><br>

            <!-- Dropdown -->
            <label for="level">Choose your study level:</label>

            <select id="level" name="level">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>

            <br><br>

            <!-- Textarea -->
            <label for="message">Tell us about your study goals:</label>

            <br>

            <textarea id="message" name="message" rows="6" cols="40"></textarea>

            <br><br>

            <!-- Submit -->
            <button type="submit">Submit</button>

        </form>

    </main>

    <footer>
    <p>&copy; 2026 Study Space</p>
    <p>Made with care by <strong>Nada Ibrahim</strong></p>
</footer>

</body>

</html>
