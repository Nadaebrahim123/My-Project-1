<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Blog</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h2>Contact Us</h2>

        <form action="#" method="post">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age">

            <br><br>

            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date">

            <br><br>

            <p>How did you hear about us?</p>

            <input type="radio" id="google" name="source" value="google">
            <label for="google">Google</label>

            <input type="radio" id="friend" name="source" value="friend">
            <label for="friend">Friend</label>

            <input type="radio" id="social" name="source" value="social">
            <label for="social">Social Media</label>

            <br><br>

            <p>What are you interested in?</p>

            <input type="checkbox" id="html" name="interest" value="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="interest" value="css">
            <label for="css">CSS</label>

            <input type="checkbox" id="database" name="interest" value="database">
            <label for="database">Databases</label>

            <br><br>

            <label for="course">Choose a course:</label>

            <select id="course" name="course">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="database">Database</option>
            </select>

            <br><br>

            <label for="message">Your Message:</label>

            <br>

            <textarea id="message" name="message" rows="6" cols="40"></textarea>

            <br><br>

            <button type="submit">Submit</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>

</body>

</html>
